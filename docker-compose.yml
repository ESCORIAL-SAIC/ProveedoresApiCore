services:
  api:
    image: ghcr.io/escorial-saic/proveedoresapicore:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${API_PORT:-5178}:8080"
    environment:
      # La cadena nunca va dentro de la imagen: se lee del .env del server.
      # El doble guion bajo es el separador de secciones de ASP.NET Core.
      ConnectionStrings__Proveedores: ${CONNECTION_STRING:?falta CONNECTION_STRING en .env}
      Cors__Origenes__0: ${CORS_ORIGEN:-http://localhost:5000}
      ASPNETCORE_ENVIRONMENT: Production
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
